server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed build output — content-addressed, cache hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Service worker + entry HTML must always be re-checked so a new SW_VERSION
    # (and the bundle it points at) reaches clients.
    location = /service-worker.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        default_type application/manifest+json;
        try_files $uri =404;
    }

    # Bundled storage fallback (only hit if VITE_CATALOG_BASE / VITE_MEDIA_BASE
    # were left unset at build time).
    location /storage/ {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=300";
        try_files $uri =404;
    }

    # SPA routing — unknown paths render the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/manifest+json;
}
