server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    autoindex off;

    # nginx:1.27 mime.types already maps .json / .webp / .avif / .svg.

    # Uploaded originals — present in the mounted dashboard/media/ tree but never
    # part of the published (CDN) surface; the S3 backend skips them too.
    location /products_raw_media/ {
        return 404;
    }

    location / {
        # Public product data — any storefront origin may read it.
        add_header Access-Control-Allow-Origin  "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Accept, Content-Type, Range" always;
        add_header Cache-Control "public, max-age=300" always;

        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin  "*" always;
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Accept, Content-Type, Range" always;
            add_header Access-Control-Max-Age 86400 always;
            add_header Content-Length 0;
            return 204;
        }

        try_files $uri =404;
    }

    gzip on;
    gzip_vary on;
    gzip_types application/json image/svg+xml;
}
