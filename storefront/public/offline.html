<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline — Bare Brilliant</title>
    <meta name="theme-color" content="#0b0b0a" />
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-content: center;
        gap: 1rem;
        padding: 2rem;
        text-align: center;
        background: #0b0b0a;
        color: #ded8ce;
        font: 400 16px/1.6 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      .d { width: 34px; height: 34px; margin: 0 auto; border: 1px solid #b79a72; transform: rotate(45deg); }
      h1 { margin: 0.5rem 0 0; font: 400 1.9rem/1.15 Georgia, "Times New Roman", serif; color: #f4f1eb; letter-spacing: -0.01em; }
      p { margin: 0; max-width: 24rem; color: #999890; }
      button {
        margin-top: 0.5rem;
        min-height: 44px;
        padding: 0.7rem 1.5rem;
        font: 600 0.8rem/1 inherit;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #0b0b0a;
        background: #f4f1eb;
        border: 0;
        border-radius: 5px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <span class="d" aria-hidden="true"></span>
    <h1>You're offline</h1>
    <p>Bare Brilliant needs a connection to show designs and prices. Your bag and shortlist are safe on this device.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </body>
</html>
